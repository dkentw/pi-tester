[project]
name = "pitester"
version = "1.0.0"
description = "Automation test framework"
license = { text = "MIT" }
authors = [{ name = "Dken", email = "dken.tw@gmail.com" }]
keywords = ["automation", "test"]
requires-python = ">=3.6"
dependencies = [
    "junit-xml>=1.7",
]

[project.scripts]
pitester = "pitester:main"

[project.urls]
Homepage = "https://github.com/dkentw/pi-tester"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["Engine"]
include = ["pitester.py", "agent.py"]
